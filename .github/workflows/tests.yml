name: tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [modular, dev]
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm install --no-audit --no-fund
      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package.json') }}
      - name: Install Chromium
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: npx playwright-core install --with-deps chromium
      - name: Install Chromium system deps (cache hit)
        if: steps.pwcache.outputs.cache-hit == 'true'
        run: npx playwright-core install-deps chromium
      - name: Version check
        run: python3 tools/check-version.py
      - name: Unit tests
        run: npm run test:unit
      - name: Smoke tests (Playwright, DPR3 phone emulation, 360x780 + 780x360)
        run: npm run test:smoke
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: tests/e2e/out/
