name: pr-checks

# Gate for pull requests into develop, and for a develop -> main release candidate.
# Static site: no build.
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests
        run: node --test tests/unit/*.test.js

  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Cache-tag check
        run: python3 tools/check-version.py
      # Every pull request that changes app files must bump APP_VERSION against its base branch (YYYY.MM.DD.N, the
      # next counter for the day; see tools/tcversion.py). Into develop: each dev build gets its own number (Vinh,
      # 21 Nov). Into main: a develop -> main release carries develop's bump, which is already above main.
      # The deploys also stamp BUILD_ID; this check still guards the bump.
      - name: APP_VERSION bump against the base branch
        if: github.base_ref == 'main' || github.base_ref == 'develop'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          case "$BASE_REF" in main|develop) ;; *) echo "unexpected base $BASE_REF"; exit 1 ;; esac
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          python3 tools/check-bump.py "origin/$BASE_REF"

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: npx playwright-core install --with-deps chromium
      - name: Install Chromium system deps (cache hit)
        if: steps.pwcache.outputs.cache-hit == 'true'
        run: npx playwright-core install-deps chromium
      # tests/ci/smoke.mjs serves the repo root itself (static, no build) and runs the checks.
      # A failing check writes tests/ci/out/<name>.png before the process exits.
      - name: Smoke tests
        run: node tests/ci/smoke.mjs
      - name: Flow layout
        run: node tests/ci/flow-layout.spec.mjs
      - name: Upload smoke screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: tests/ci/out/
          if-no-files-found: ignore
