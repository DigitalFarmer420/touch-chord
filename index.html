<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14120f">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Touch Chord</title>
<script>
/* Hide controls until saved settings are applied (no default-then-jump flash). Failsafe unhides. */
document.documentElement.className += " tc-boot";
setTimeout(function () { document.documentElement.classList.remove("tc-boot"); }, 1500);
</script>
<style>
:root {
  color-scheme: dark;
  --bg: #14120f;
  --bg-2: #1c1914;
  --ink: #f4efe6;
  --muted: #b7ab9a;
  --line: #3a332b;
  --pad: #262219;
  --copper: #e2a15a;
  --copper-ink: #2a1c0c;
  --sea: #8fcbb8;
  --lilac: #d2a9cc;
  --moss: #b7c98a;
  --danger: #e07a62;
  --ctrl: 40px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  min-height: 100%;
  min-height: -webkit-fill-available;
  background: var(--bg);
  color: var(--ink);
  font-family: "Avenir Next", "Segoe UI", sans-serif;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  background:
    radial-gradient(900px 380px at 8% -10%, rgba(143, 203, 184, 0.16), transparent 55%),
    radial-gradient(700px 420px at 110% 110%, rgba(226, 161, 90, 0.12), transparent 50%),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.015) 0 1px, transparent 1px 14px),
    var(--bg);
}

button, input, select { font: inherit; color: inherit; }

button {
  height: var(--ctrl);
  min-height: var(--ctrl);
  border: 1px solid var(--line);
  background: var(--bg-2);
  color: var(--ink);
  border-radius: 10px;
  padding: 0 12px;
  cursor: pointer;
  touch-action: manipulation;
  line-height: 1;
}

button.on, button[aria-pressed="true"].toggle.on {
  background: var(--copper);
  color: var(--copper-ink);
  border-color: transparent;
}

#app {
  height: 100vh;
  height: 100dvh;
  min-height: 0;
  max-height: 100dvh;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  gap: 12px;
  padding: calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  overflow: visible;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

/* Slim brand bar; the current chord lives in the Now card beside Suggestions. */
.topbar {
  display: flex;
  align-items: center;
  gap: 12px 16px;
  min-height: 0;
  flex: 0 0 auto;
}

.brand {
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-size: 12px;
  color: var(--sea);
}

html.tc-boot #app { visibility: hidden; }

/* Configuration menu (top-right of the brand bar). */
.topbar { position: relative; }
/* Wrapper is only a text line tall so the button never grows the bar
   (keyboard keeps its height); the 24px button overflows it visually. */
.config { position: relative; margin-left: auto; flex: 0 0 auto; width: 74px; height: 14px; align-self: center; }
.config-btn {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  height: 24px;
  min-height: 24px;
  padding: 0 10px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  background: transparent;
}
.config-btn[aria-expanded="true"] { color: var(--ink); border-color: var(--copper); }
.config-btn::after { content: ""; position: absolute; inset: -8px -6px; }
.config-menu {
  position: absolute;
  top: calc(100% + 12px);
  right: 0;
  z-index: 50;
  min-width: 170px;
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg-2);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.config-menu[hidden] { display: none; }
.config-menu button {
  width: 100%;
  height: 40px;
  min-height: 40px;
  text-align: left;
  font-size: 14px;
  padding: 0 12px;
}
.config-menu .danger { color: var(--danger); }
.config-menu .danger:active { background: var(--danger); color: var(--copper-ink); }
.config-btn.flash { background: var(--copper); color: var(--copper-ink); border-color: transparent; }
.toast {
  position: fixed;
  left: 50%;
  top: calc(12px + env(safe-area-inset-top));
  transform: translate(-50%, -8px);
  z-index: 60;
  padding: 8px 14px;
  border-radius: 10px;
  background: var(--copper);
  color: var(--copper-ink);
  font-size: 13px;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease, transform 0.18s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Hero row: Now (left) beside Suggestions = Style + Next (right). */
.hero {
  display: flex;
  align-items: stretch;
  gap: 10px;
  flex: 0 0 auto;
  min-width: 0;
  min-height: 0;
}

.now-card {
  --now-w: 196px;
  --sym: 48px;
  flex: 0 0 var(--now-w);
  width: var(--now-w);
  min-width: 0;
  border: 1px solid var(--line);
  background: rgba(28, 25, 20, 0.55);
  border-radius: 14px;
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: 4px;
  overflow: hidden;
}

.now-card .card-label {
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

#symbol {
  display: inline-block;
  max-width: none;
  font-family: Palatino, "Iowan Old Style", Georgia, serif;
  font-size: var(--sym);
  font-weight: 700;
  line-height: 0.95;
  letter-spacing: -0.02em;
  white-space: nowrap;
}

#symbol.sounding { color: var(--copper); }

#tones {
  max-width: 100%;
  color: var(--muted);
  font-size: 14px;
  letter-spacing: 0.06em;
  line-height: 1.2;
  white-space: normal;
  overflow-wrap: anywhere;
}


.seg {
  display: flex;
  flex-wrap: nowrap;
  gap: 4px;
}

.seg button { min-width: 44px; }

#bass.on { background: var(--sea); color: #10211c; border-color: transparent; }


#chords {
  flex: 0 0 228px;
  align-self: stretch;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-top: 4px;
  touch-action: none;
}

#chords button { touch-action: none; }

#chords .dock-label {
  color: var(--muted);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

#palette {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: repeat(4, minmax(0, 1fr));
  grid-auto-flow: column;
  gap: 6px;
  flex: 1 1 auto;
  min-height: 0;
}

#types, #exts { display: contents; }

#types button, #exts button {
  width: 100%;
  min-width: 0;
  height: auto;
  min-height: 40px;
  text-align: center;
  padding: 0 4px;
  font-size: 13px;
}

.stage {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow: hidden;
}

.controls {
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  gap: 8px 12px;
  min-width: 0;
}
.soundbox {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-left: auto;
  flex: 0 0 auto;
}
.keybox { flex: 0 0 auto; }

.keybox {
  display: flex;
  align-items: center;
  gap: 6px;
}

#keyReadout {
  color: var(--muted);
  font-size: 13px;
}

select {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  height: var(--ctrl);
  min-height: var(--ctrl);
  padding: 0 8px;
  touch-action: manipulation;
  line-height: 1;
}

body.is-key #types button {
  opacity: 0.4;
  pointer-events: none;
}

/* Yoga Deep stillness: Dim/Sus4 unavailable (disabled, no pointer holds). */
#types button:disabled,
#types button.gated {
  opacity: 0.35;
  pointer-events: none;
  cursor: default;
}

#exts button.dormant { opacity: 0.45; }

.pads {
  display: grid;
  gap: 8px;
  flex: 0 0 auto;
  min-height: 104px;
  touch-action: none;
}

.pads.chromatic { grid-template-columns: repeat(12, minmax(0, 1fr)); }
.pads.diatonic { grid-template-columns: repeat(7, minmax(0, 1fr)); }

.pad {
  -webkit-appearance: none;
  appearance: none;
  height: 104px;
  min-height: 104px;
  border-radius: 14px;
  background: var(--pad);
  border: 1px solid #423a30;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  gap: 4px;
  padding: 10px 4px 12px;
  font-size: clamp(15px, 1.5vw, 20px);
  line-height: 1;
}

.pad .roman {
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--muted);
}

.pad.major { box-shadow: inset 0 -4px 0 var(--copper); }
.pad.minor { box-shadow: inset 0 -4px 0 var(--sea); }
.pad.dim { box-shadow: inset 0 -4px 0 var(--lilac); }
.pad.sus4 { box-shadow: inset 0 -4px 0 var(--moss); }

.pad.selected { outline: 2px solid var(--copper); outline-offset: -2px; }

.pad.held {
  background: var(--copper);
  color: var(--copper-ink);
  border-color: transparent;
  box-shadow: none;
}

.pad.held .roman { color: rgba(42, 28, 12, 0.7); }

.voicing {
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex: 0 0 auto;
  width: 100%;
  max-width: none;
  min-width: 0;
  align-self: stretch;
}
.vhead {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 0;
}

.vhead b { color: var(--ink); font-weight: 650; }

.vticks {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  letter-spacing: 0.06em;
  color: var(--muted);
  text-transform: uppercase;
}

.vticks span.on { color: var(--copper); }

/* Copper sliders: forced track + thumb on every range input (all engines). */
html body input[type="range"],
html body .voicing input[type="range"],
html body footer input[type="range"],
html body footer label input[type="range"] {
  -webkit-appearance: none !important;
  -moz-appearance: none !important;
  appearance: none !important;
  height: 28px;
  background: transparent !important;
  margin: 0;
  padding: 0;
  border: 0;
  touch-action: manipulation;
  accent-color: #e2a15a !important;
  accent-color: var(--copper, #e2a15a) !important;
  color: var(--copper, #e2a15a);
  outline: none;
}
html body .voicing input[type="range"] { width: 100%; }

html body input[type="range"]::-webkit-slider-runnable-track {
  -webkit-appearance: none !important;
  height: 6px;
  background: linear-gradient(90deg, var(--copper, #e2a15a), #c47a3a) !important;
  background-color: var(--copper, #e2a15a) !important;
  border: 0 !important;
  border-radius: 999px;
}

html body input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none !important;
  appearance: none !important;
  width: 18px;
  height: 18px;
  margin-top: -6px;
  border-radius: 50%;
  background: var(--copper, #e2a15a) !important;
  background-color: var(--copper, #e2a15a) !important;
  border: 2px solid var(--copper-ink, #2a1c0c) !important;
  box-shadow: 0 0 0 1px rgba(226, 161, 90, 0.35) !important;
}

html body input[type="range"]::-moz-range-track {
  height: 6px;
  background: linear-gradient(90deg, var(--copper, #e2a15a), #c47a3a) !important;
  background-color: var(--copper, #e2a15a) !important;
  border-radius: 999px;
  border: 0 !important;
}

html body input[type="range"]::-moz-range-progress {
  height: 6px;
  background: var(--copper, #e2a15a) !important;
  border-radius: 999px;
}

html body input[type="range"]::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--copper, #e2a15a) !important;
  border: 2px solid var(--copper-ink, #2a1c0c) !important;
  box-shadow: 0 0 0 1px rgba(226, 161, 90, 0.35) !important;
}

html body input[type="range"]:focus-visible::-webkit-slider-thumb {
  box-shadow: 0 0 0 3px rgba(226, 161, 90, 0.45) !important;
}

.suggest-card {
  border: 1px solid var(--line);
  background: rgba(28, 25, 20, 0.55);
  border-radius: 14px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1 1 auto;
  min-width: 0;
}
.style-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  min-width: 0;
}
.style-row .lbl {
  color: var(--muted);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  flex: 0 0 auto;
}
.style-row button {
  height: var(--ctrl);
  min-height: var(--ctrl);
  padding: 0 12px;
  border-radius: 999px;
  font-size: 13px;
}
#styles {
  flex-wrap: wrap;
}
/* Next grid: 4x2. Columns Bright / Dark / Tension / Color, rows up / down. */
.next-wrap {
  display: grid;
  grid-template-columns: max-content repeat(4, minmax(0, 1fr));
  grid-template-rows: auto repeat(2, var(--chip));
  gap: var(--next-vgap) 5px;
  align-items: stretch;
  flex: 0 0 auto;
  min-width: 0;
}
.next-wrap .axis {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-align: center;
  align-self: end;
  padding-bottom: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* "Suggestions" label in the header corner, same row as the lane axes. */
.next-wrap .corner {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-align: left;
  justify-self: start;
  align-self: end;
  padding-bottom: 1px;
  white-space: nowrap;
  overflow: visible;
  min-width: 0;
}
.next-wrap .rowlbl {
  color: var(--muted);
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.next-wrap button {
  height: auto;
  min-height: 0;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 700;
  border-radius: 10px;
  padding: 0 2px;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.next-wrap .empty {
  border: 1px dashed rgba(58, 51, 43, 0.7);
  border-radius: 10px;
  pointer-events: none;
}
.next-wrap button.major {
  background: #e2b15a;
  border-color: #c4923e;
  color: #2a1c0c;
}
.next-wrap button.minor {
  background: #7d6ea8;
  border-color: #6a5c96;
  color: #f7f3ff;
}
.next-wrap button.tension {
  background: #2a1f45;
  border-color: #4a3a72;
  color: #e8dff8;
}
.next-wrap button.color {
  background: #6a8f7e;
  border-color: #557866;
  color: #0f1f18;
}
/* Next grid + Sustain pedal (Piano only) to its right. */
.next-row {
  display: flex;
  align-items: stretch;
  gap: 8px;
  flex: 0 0 auto;
  min-width: 0;
  --chip: 40px;
  --next-vgap: 4px;
}
.next-row > .next-wrap {
  flex: 1 1 0;
  min-width: 0;
}
#sustainBtn {
  flex: 0 0 auto;
  width: 84px;
  /* Two Next chord-button rows + the gap between them (not axis headers). */
  height: calc(var(--chip) * 2 + var(--next-vgap));
  min-height: 0;
  /* Bottom-align with the Next grid: the axis header is only the grid's top
     (auto) row, so the two chord rows end at .next-wrap's bottom edge. With
     the exact two-row height above, top and bottom both line up with the
     chord buttons (never centered, never stretched into the axis headers). */
  align-self: flex-end;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 6px;
  border-radius: 14px;
  border: 2px solid var(--line);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.04em;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  transition: background 60ms linear, transform 60ms linear;
}
#sustainBtn.on {
  background: var(--sea);
  color: #10211c;
  border-color: #10211c;
  box-shadow: inset 0 0 0 3px var(--sea), inset 0 0 0 5px #10211c;
  transform: translateY(1px);
}
#sustainBtn[aria-disabled="true"] {
  opacity: 0.35;
  cursor: default;
}

/* Thin loop-position indicator. */
.phase-track {
  position: relative;
  flex: 0 0 auto;
  height: 3px;
  width: 100%;
  max-width: none;
  align-self: stretch;
  background: rgba(58, 51, 43, 0.55);
  border-radius: 999px;
  overflow: hidden;
  pointer-events: none;
}

.phase {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  width: 0;
  background: var(--sea);
  pointer-events: none;
}

footer {
  display: flex;
  align-items: center;
  gap: 10px 16px;
  min-height: 0;
}

footer label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--muted);
  min-width: 0;
}

/* Sliders shrink inside their label (never overflow into the next label). */
footer label input[type="range"] { width: 110px; min-width: 0; flex: 0 1 110px; }

.bpm b { color: var(--ink); min-width: 2.2ch; display: inline-block; }

.transport {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
}

#rec.on {
  background: var(--danger);
  color: #2a100c;
  border-color: transparent;
}

#play.on {
  background: var(--sea);
  color: #10211c;
  border-color: transparent;
}

#loopStatus {
  font-size: 12px;
  color: var(--muted);
  min-width: 4.5em;
}

#unlock {
  align-self: center;
  background: var(--copper);
  color: var(--copper-ink);
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 14px;
  font-weight: 650;
  pointer-events: none;
}

#unlock[hidden] { display: none; }

/* The audio hint floats in the slim brand bar instead of taking a row. */
.stage { position: relative; }
#unlock {
  position: absolute;
  top: 0;
  right: 0;
  z-index: 5;
  padding: 4px 12px;
  font-size: 12px;
}

/* Fixed rows keep their height; keyboard absorbs tight heights. */
.stage > * { flex-shrink: 0; }
.stage > .kb-wrap { flex-shrink: 1; }


.kb-wrap {
  margin-top: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1 1 auto;
  min-height: 0;
}

.layouts { align-items: center; }

.layouts .lbl {
  color: var(--muted);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-right: 4px;
}

.kb { touch-action: none; }

.kb.piano {
  position: relative;
  flex: 1 1 auto;
  height: auto;
  min-height: 180px;
  display: flex;
  flex-direction: column;
}

.kb.piano .whites {
  display: flex;
  flex: 1 1 auto;
  height: auto;
  min-height: 0;
  gap: 3px;
}

.kb.piano .blacks {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.kb .pad {
  height: auto;
  min-height: 0;
  border-radius: 0 0 8px 8px;
  padding: 4px 2px 8px;
  font-size: 12px;
}

.kb.piano .white {
  flex: 1 1 0;
  height: 100%;
  background: #f4efe4;
  color: #2a1c0c;
  border: 1px solid #c9bfb0;
}

.kb.piano .black {
  pointer-events: auto;
  position: absolute;
  top: 0;
  height: 62%;
  width: var(--black-w, 18px);
  background: #1b1714;
  color: #f4efe4;
  border: 1px solid #000;
  z-index: 2;
  font-size: 10px;
  padding-bottom: 4px;
}

.kb.piano { --black-w: calc(100% / var(--whites) * 0.58); }

.kb .pad.out { opacity: 0.32; }

.kb.piano .white.held,
.kb.piano .black.held,
.kb.fourths .pad.held {
  background: var(--copper);
  color: var(--copper-ink);
}

.kb.fourths {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-template-rows: repeat(4, minmax(0, 1fr));
  gap: 6px;
  flex: 1 1 auto;
  min-height: 140px;
}

<script>
"use strict";

(function () {
  var LETTERS = ["C", "D", "E", "F", "G", "A", "B"];
  var NATURAL = [0, 2, 4, 5, 7, 9, 11];

  // Preferred chromatic spellings: C C# D Eb E F F# G Ab A Bb B
  var ROOT_SPELL = [
    { li: 0, acc: 0 },
    { li: 0, acc: 1 },
    { li: 1, acc: 0 },
    { li: 2, acc: -1 },
    { li: 2, acc: 0 },
    { li: 3, acc: 0 },
    { li: 3, acc: 1 },
    { li: 4, acc: 0 },
    { li: 5, acc: -1 },
    { li: 5, acc: 0 },
    { li: 6, acc: -1 },
    { li: 6, acc: 0 }
  ];

  var DEGREE_STEPS = {
    0: 0,
    2: 1,
    3: 2,
    4: 2,
    5: 3,
    6: 4,
    7: 4,
    8: 5,
    9: 5,
    10: 6,
    11: 6,
    14: 1
  };

  var VOICINGS = ["drop", "low", "close", "high", "bright"];

  var MAJOR_ROMAN = ["I", "ii", "iii", "IV", "V", "vi", "vii"];
  var MINOR_ROMAN = ["i", "ii", "III", "iv", "v", "VI", "VII"];
  var MAJOR_QUALITY = ["major", "minor", "minor", "major", "major", "minor", "dim"];
  var MINOR_QUALITY = ["minor", "dim", "major", "minor", "minor", "major", "major"];
  var MAJOR_SCALE = [0, 2, 4, 5, 7, 9, 11];
  var MINOR_SCALE = [0, 2, 3, 5, 7, 8, 10];

  function mod12(n) {
    return ((n % 12) + 12) % 12;
  }

  function accStr(acc) {
    if (acc === 0) return "";
    if (acc === 1) return "#";
    if (acc === -1) return "b";
    if (acc === 2) return "x";
    if (acc === -2) return "bb";
    if (acc > 2) return new Array(acc + 1).join("#");
    return new Array(-acc + 1).join("b");
  }

  function spellRoot(pc) {
    var s = ROOT_SPELL[mod12(pc)];
    return { li: s.li, acc: s.acc };
  }

  function rootPitchClass(root) {
    return mod12(NATURAL[root.li] + root.acc);
  }

  function noteName(root) {
    return LETTERS[root.li] + accStr(root.acc);
  }

  function spellInterval(root, semitones) {
    var steps = DEGREE_STEPS[semitones];
    if (steps == null) throw new Error("unsupported interval " + semitones);
    var li = (root.li + steps) % 7;
    var naturalPc = NATURAL[li];
    var target = mod12(rootPitchClass(root) + semitones);
    var acc = target - naturalPc;
    if (acc > 6) acc -= 12;
    if (acc < -6) acc += 12;
    return { li: li, acc: acc, pc: target, name: LETTERS[li] + accStr(acc) };
  }

  function normalizeExt(ext) {
    ext = ext || {};
    return {
      six: !!ext.six,
      min7: !!ext.min7,
      maj7: !!ext.maj7,
      nine: !!(ext.nine || ext["9"])
    };
  }

  function chordIntervals(type, ext) {
    var base = {
      major: [0, 4, 7],
      minor: [0, 3, 7],
      sus4: [0, 5, 7],
      dim: [0, 3, 6]
    }[type];
    if (!base) throw new Error("unknown chord type " + type);
    var e = normalizeExt(ext);
    var iv = base.slice();
    var hasMaj7 = e.maj7;
    var hasMin7 = e.min7 && !hasMaj7;
    var has7 = hasMaj7 || hasMin7;
    if (e.six && !has7) iv.push(9);
    if (hasMin7) iv.push(10);
    if (hasMaj7) iv.push(11);
    if (e.nine) iv.push(14);
    return iv;
  }

  function chordToneNames(rootSpell, type, ext) {
    return chordIntervals(type, ext).map(function (iv) {
      return spellInterval(rootSpell, iv).name;
    });
  }

  function tones(rootPc, type, ext) {
    return chordToneNames(spellRoot(rootPc), type, ext);
  }

  function applyVoicing(midis, voicing) {
    var n = midis.slice();
    if (voicing === "low") return n.map(function (m) { return m - 12; });
    if (voicing === "high") return n.map(function (m) { return m + 12; });
    if (voicing === "bright") {
      return n.map(function (m, i) { return m + (i === n.length - 1 ? 24 : 12); });
    }
    if (voicing === "drop") {
      if (n.length >= 2) n[n.length - 2] -= 12;
      n.sort(function (a, b) { return a - b; });
      return n;
    }
    if (voicing !== "close") throw new Error("unknown voicing " + voicing);
    return n;
  }

  function voicedMidis(rootPc, type, ext, voicing, rootMidiOpt) {
    var rootMidi = (typeof rootMidiOpt === "number" && isFinite(rootMidiOpt)) ? rootMidiOpt : 60 + mod12(rootPc);
    var placed = chordIntervals(type, ext).map(function (iv) { return rootMidi + iv; });
    return applyVoicing(placed, voicing || "close");
  }

  function pitchClasses(midis) {
    var set = {};
    midis.forEach(function (m) { set[mod12(m)] = true; });
    return Object.keys(set).map(Number).sort(function (a, b) { return a - b; });
  }

  function chordSymbol(rootName, type, ext) {
    var e = normalizeExt(ext);
    var hasMaj7 = e.maj7;
    var hasMin7 = e.min7 && !hasMaj7;
    var has7 = hasMaj7 || hasMin7;
    var nine = e.nine;
    var six = e.six && !has7;

    if (type === "sus4") {
      if (hasMaj7 && nine) return rootName + "maj9sus4";
      if (hasMin7 && nine) return rootName + "9sus4";
      if (nine && six) return rootName + "6sus4(add9)";
      if (nine) return rootName + "sus4(add9)";
      if (hasMaj7) return rootName + "maj7sus4";
      if (hasMin7) return rootName + "7sus4";
      if (six) return rootName + "6sus4";
      return rootName + " sus4";
    }

    if (hasMaj7 && nine) {
      if (type === "minor") return rootName + "m(maj9)";
      if (type === "dim") return rootName + "dim(maj9)";
      return rootName + "maj9";
    }
    if (hasMin7 && nine) {
      if (type === "minor") return rootName + "m9";
      if (type === "dim") return rootName + "m9b5";
      return rootName + "9";
    }
    if (nine) {
      if (six && type === "minor") return rootName + "m6(add9)";
      if (six && type === "dim") return rootName + "dim6(add9)";
      if (six) return rootName + "6(add9)";
      if (type === "minor") return rootName + "m(add9)";
      if (type === "dim") return rootName + "dim(add9)";
      return rootName + "add9";
    }
    if (hasMaj7) {
      if (type === "minor") return rootName + "m(maj7)";
      if (type === "dim") return rootName + "dim(maj7)";
      return rootName + "maj7";
    }
    if (hasMin7) {
      if (type === "minor") return rootName + "m7";
      if (type === "dim") return rootName + "m7b5";
      return rootName + "7";
    }
    if (six) {
      if (type === "minor") return rootName + "m6";
      if (type === "dim") return rootName + "dim6";
      return rootName + "6";
    }
    if (type === "minor") return rootName + "m";
    if (type === "dim") return rootName + "dim";
    if (type === "major") return rootName;
    throw new Error("unknown chord type " + type);
  }

  function scaleDegrees(keyPc, mode) {
    var minor = mode === "minor" || mode === "natural-minor";
    var intervals = minor ? MINOR_SCALE : MAJOR_SCALE;
    var qualities = minor ? MINOR_QUALITY : MAJOR_QUALITY;
    var romans = minor ? MINOR_ROMAN : MAJOR_ROMAN;
    var root = spellRoot(keyPc);
    return intervals.map(function (iv, i) {
      var spelled = spellInterval(root, iv);
      return {
        degree: i + 1,
        roman: romans[i],
        pc: spelled.pc,
        name: spelled.name,
        type: qualities[i],
        rootSpell: { li: spelled.li, acc: spelled.acc }
      };
    });

    state.extensions.nine = !!(item.extensions && item.extensions.nine);
    state.rootPc = item.rootPc;
    state.type = item.type;
    if (item.degree) {
      state.forceChord = null;
      if (state.keyMode) state.degree = item.degree;
    } else {
      state.forceChord = { rootPc: item.rootPc, type: item.type };
    }
    unlock();
    refreshHeld();
    var spec = computeSpec();
    // Highlight uses exact pad midis when present; otherwise nearest same-pc
    // pad so drop/low/bright (and off-keyboard registers) still light the
    // notes the suggestion is sounding. Audio keeps the true voiced midis.
    suggestPreview = { type: spec.type, midis: highlightMidisFromSpec(spec.midis) };
    // Finger-held pads already morphed to this chord above; don't stack a
    // duplicate audition on top (doubles level, can clip). Sustain-pool
    // voices don't count as holding, so Next still auditions over the pedal.
    ChordAudio.stopChord("suggest");
    if (!state.holding) ChordAudio.playChord("suggest", spec.midis, { bass: spec.bassOut, sound: state.sound });
    updateSymbol();
    if (suggestTimer) clearTimeout(suggestTimer);
    suggestTimer = setTimeout(clearSuggestPreview, 1600);
  }

  // Bright = major-family (incl. maj7 / dom7 / add9), Dark = minor-family
  // (Em lives here), Tension = diminished / half-diminished / sus only,
  // Color = soft borrowed / modal hops tagged via entry.alt (checked first).
  function suggestLane(item) {
    if (item.alt) return "color";
    if (item.type === "dim" || item.type === "sus4") return "tension";
    if (item.type === "minor") return "dark";
    return "bright";
  }

  function suggestionItemSig(item) {
    return item.rootPc + ":" + item.type + ":" + (item.qualityLabel || "");
  }

  function chipSymbol(item) {
    var label = item.qualityLabel || "";
    var root = item.name.slice(0, item.name.length - label.length) || Theory.NOTE_NAMES[item.rootPc];
    if (item.type === "dim" && (label === "dim" || label === "")) return root + "\u00b0";
    if (item.type === "sus4") return root + label.replace(/^sus4/, "sus");
    return root + label;
  }

  // Map the ranked pool into 4 lanes x (up, down). Each slot first takes the
  // highest-ranked item moving in its direction; leftovers (or "same"-root
  // items) fill any still-empty slot in their own lane. No match = empty cell.
  function slotSuggestions(items) {
    var lanes = ["bright", "dark", "tension", "color"];
    var slots = {
      bright: { up: null, down: null },
      dark: { up: null, down: null },
      tension: { up: null, down: null },
      color: { up: null, down: null }
    };
    var used = {};
    var i, item, sig, lane;

    for (var L = 0; L < lanes.length; L++) {
      lane = lanes[L];
      for (i = 0; i < items.length; i++) {
        item = items[i];
        if (suggestLane(item) !== lane) continue;
        sig = suggestionItemSig(item);
        if (used[sig]) continue;
        if (item.dir === "up" && !slots[lane].up) {
          slots[lane].up = item;
          used[sig] = true;
        } else if (item.dir === "down" && !slots[lane].down) {
          slots[lane].down = item;
          used[sig] = true;
        }
      }
      for (i = 0; i < items.length; i++) {
        item = items[i];
        if (suggestLane(item) !== lane) continue;
        sig = suggestionItemSig(item);
        if (used[sig]) continue;
        if (!slots[lane].up) {
          slots[lane].up = item;
          used[sig] = true;
        } else if (!slots[lane].down) {
          slots[lane].down = item;
          used[sig] = true;
        }
      }
    }
    return slots;
  }

  var LANES = [
    { id: "bright", label: "Bright", tone: "major" },
    { id: "dark", label: "Dark", tone: "minor" },
    { id: "tension", label: "Tension", tone: "tension" },
    { id: "color", label: "Color", tone: "color" }
  ];

  function paintSuggestions(spec) {
    var items = nextChords(spec, 20);
    var slots = slotSuggestions(items);
    var sig = state.style + "@" + currentLoopBar() + "|" + LANES.map(function (ln) {
      return [slots[ln.id].up, slots[ln.id].down].map(function (it) {
        return it ? (it.name + it.dir + it.degree + (it.qualityLabel || "")) : "-";
      }).join(",");
    }).join("|");
    if (sig === suggestSig) return;
    suggestSig = sig;
    var el = document.getElementById("suggest");
    el.className = "next-wrap";
    el.innerHTML = "";

    function add(tag, cls, text) {
      var n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      el.appendChild(n);
      return n;
    }

    // Header row: "Suggestions" corner label + column labels.
    add("div", "corner", "Suggestions");
    LANES.forEach(function (ln) { add("div", "axis", ln.label); });

    function addCell(item, ln, dirWord) {
      if (!item) {
        add("div", "empty").setAttribute("aria-hidden", "true");
        return;
      }
      var b = add("button", ln.tone, chipSymbol(item));
      b.type = "button";
      b.setAttribute("aria-label", item.name + " (" + ln.label + ", " + dirWord + ")");
      // Touch/pen fire on pointerup: browsers drop the synthetic click when
      // another finger is down (e.g. holding Sustain). Click stays for
      // mouse / keyboard, de-duplicated against the pointer tap.
      var tapId = null;
      b.addEventListener("pointerdown", function (e) {
        if (e.pointerType === "mouse") return;
        tapId = e.pointerId;
      });
      b.addEventListener("pointercancel", function () { tapId = null; });
      b.addEventListener("pointerup", function (e) {
        if (tapId == null || e.pointerId !== tapId) return;
        tapId = null;
        var hit = document.elementFromPoint(e.clientX, e.clientY);
        if (!hit || !b.contains(hit)) return;
        suggestTapAt = Date.now();
        applySuggestion(item);
      });
      b.addEventListener("click", function () {
        // The grid may have been rebuilt by the pointer tap, so the click
        // can land on a *different* chip; ignore any click right after a tap.
        if (suggestTapAt && Date.now() - suggestTapAt < 800) {
          suggestTapAt = 0;
          return;
        }
        applySuggestion(item);
      });
    }

    [["up", "\u2191"], ["down", "\u2193"]].forEach(function (row) {
      add("div", "rowlbl", row[1]).setAttribute("aria-hidden", "true");
      LANES.forEach(function (ln) { addCell(slots[ln.id][row[0]], ln, row[0]); });
    });
  }

  // Shrink the Now symbol only when a long name (e.g. F#6sus4(add9)) would
  // overflow its card; short ones like Cmaj7 keep the full display size.
  function fitNowSymbol() {
    var sym = document.getElementById("symbol");
    var card = sym && sym.parentNode;
    if (!card) return;
    sym.style.fontSize = "";
    var cs = getComputedStyle(card);
    var avail = card.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var w = sym.getBoundingClientRect().width;
    if (!(avail > 0) || !(w > avail)) return;
    var base = parseFloat(getComputedStyle(sym).fontSize) || 48;
    sym.style.fontSize = Math.max(14, Math.floor(base * (avail / w) * 0.98)) + "px";
  }

  window.addEventListener("resize", function () { fitNowSymbol(); });

  function updateSymbol() {
    var spec = computeSpec();
    document.getElementById("symbol").textContent = spec.symbol;
    document.getElementById("tones").textContent = spec.names.join(" ");
    fitNowSymbol();
    document.getElementById("vname").textContent = state.voicing;
    var slider = document.getElementById("voicing");
    slider.setAttribute("aria-valuetext", state.voicing);
    var ticks = document.querySelectorAll(".vticks span");
    for (var i = 0; i < ticks.length; i++) ticks[i].classList.toggle("on", VOICINGS[i] === state.voicing);
    document.body.classList.toggle("is-key", state.keyMode);
    var keyBtn = document.getElementById("keyMode");
    keyBtn.classList.toggle("on", state.keyMode);
    keyBtn.setAttribute("aria-pressed", state.keyMode ? "true" : "false");
    var types = document.querySelectorAll("#types button");
    for (var t = 0; t < types.length; t++) {
      var typeBtn = types[t];
      var onType = typeHeld(typeBtn.dataset.type) || (suggestPreview && suggestPreview.type === typeBtn.dataset.type);
      typeBtn.classList.toggle("on", onType);
      typeBtn.setAttribute("aria-pressed", onType ? "true" : "false");
    }
    var exts = document.querySelectorAll("#exts button");
    var has7 = !!(state.extensions.min7 || state.extensions.maj7);
    for (var x = 0; x < exts.length; x++) {
      var extBtn = exts[x];
      var extName = extBtn.dataset.ext;
      var onExt = !!state.extensions[extName];
      var dormant = (extName === "six" && has7) || (extName === "min7" && state.extensions.maj7);
      extBtn.classList.toggle("on", onExt);
      extBtn.classList.toggle("dormant", dormant && !onExt);
      extBtn.setAttribute("aria-pressed", onExt ? "true" : "false");
    }
    var engines = document.querySelectorAll("#engines button");
    for (var n = 0; n < engines.length; n++) {
      engines[n].classList.toggle("on", engines[n].dataset.sound === state.sound);
      engines[n].setAttribute("aria-pressed", engines[n].dataset.sound === state.sound ? "true" : "false");
    }
    var bass = document.getElementById("bass");
    bass.classList.toggle("on", state.bass);
    bass.setAttribute("aria-pressed", state.bass ? "true" : "false");
    document.getElementById("keyMajor").classList.toggle("on", state.keyScale === "major");
    document.getElementById("keyMinor").classList.toggle("on", state.keyScale === "minor");
    document.getElementById("keyReadout").textContent = state.keyMode
      ? "Key of " + Theory.NOTE_NAMES[state.keyRoot] + (state.keyScale === "minor" ? " minor" : " major")
      : "Chromatic";
    paintSuggestions(spec);
    paintPads();
    paintLoop();
    scheduleSave(200);
  }

  var paletteHolds = {};

  function typeHeld(name) {
    for (var id in paletteHolds) {
      if (paletteHolds[id].kind === "type" && paletteHolds[id].value === name) return true;
    }
    return false;
  }

  function extStillHeld(name) {
    for (var id in paletteHolds) {
      if (paletteHolds[id].kind === "ext" && paletteHolds[id].value === name) return true;
    }
    return false;
  }

  var paletteTimer = 0;

  function syncPalette() {
    var nextType = "major";
    for (var id in paletteHolds) {
      if (paletteHolds[id].kind === "type") nextType = paletteHolds[id].value;
    }
    state.type = nextType;
    var keys = ["six", "min7", "maj7", "nine"];
    for (var i = 0; i < keys.length; i++) state.extensions[keys[i]] = extStillHeld(keys[i]);
    if (paletteTimer) clearTimeout(paletteTimer);
    paletteTimer = setTimeout(function () {
      paletteTimer = 0;
      refreshHeld();
    }, 20);
  }

  function releasePalette(pointerId) {
    if (pointerId == null) {
      var any = false;
      for (var id in paletteHolds) any = true;
      if (!any) return;
      paletteHolds = {};
    } else {
      if (!paletteHolds[pointerId]) return;
      delete paletteHolds[pointerId];
    }
    syncPalette();
  }

  function onPaletteDown(e) {
    if (e.button != null && e.button !== 0) return;
    var b = e.target.closest ? e.target.closest("button") : null;
    if (!b || b.disabled || !b.closest("#palette")) return;
    if (b.dataset.type && state.keyMode) return;
    e.preventDefault();
    paletteHolds[e.pointerId] = {
      kind: b.dataset.type ? "type" : "ext",
      value: b.dataset.type || b.dataset.ext
    };
    try { b.setPointerCapture(e.pointerId); } catch (err) {}
    syncPalette();
  }

  function onPaletteUp(e) {
    releasePalette(e.pointerId);
  }


  function onTouchGone(e) {
    var changed = e.changedTouches;
    if (changed) {
      for (var i = 0; i < changed.length; i++) {
        var tgt = changed[i].target;
        if (tgt && tgt.closest && tgt.closest("#sustainBtn")) continue;
        var id = changed[i].identifier;
        liftFinger(id);
        releasePalette(id);
      }
    }
    if (!e.touches || e.touches.length === 0) {
      releaseFingers();
      releasePalette(null);
    }
  }

  function wire() {
    var keySel = document.getElementById("keyRoot");
    Theory.NOTE_NAMES.forEach(function (name, i) {
      var opt = document.createElement("option");
      opt.value = String(i);
      opt.textContent = name;
      keySel.appendChild(opt);
    });

    var palette = document.getElementById("palette");
    palette.addEventListener("pointerdown", onPaletteDown);
    palette.addEventListener("pointerup", onPaletteUp);
    palette.addEventListener("pointercancel", onPaletteUp);
    window.addEventListener("pointerup", onPaletteUp);
    window.addEventListener("pointercancel", onPaletteUp);

    document.getElementById("engines").addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (!b) return;
      state.sound = b.dataset.sound;
      ChordAudio.setSound(state.sound);
      refreshHeld();
    });

    document.getElementById("bass").addEventListener("click", function () {
      state.bass = !state.bass;
      refreshHeld();
    });

    document.getElementById("keyMode").addEventListener("click", function () {
      state.keyMode = !state.keyMode;
      if (state.keyMode) {
        var degs = Theory.scaleDegrees(state.keyRoot, state.keyScale);
        var found = 1;
        for (var i = 0; i < degs.length; i++) {
          if (degs[i].pc === state.rootPc) found = degs[i].degree;
        }
        state.degree = found;
      } else {
        var d = Theory.degreeChord(state.keyRoot, state.keyScale, state.degree);
        state.rootPc = d.rootPc;
      }
      renderPads();
      refreshHeld();
    });

    keySel.addEventListener("change", function () {
      state.keyRoot = Number(keySel.value);
      renderPads();
      refreshHeld();
    });

    document.getElementById("keyMajor").addEventListener("click", function () {
      state.keyScale = "major";
      if (state.keyMode) renderPads();
      refreshHeld();
    });
    document.getElementById("keyMinor").addEventListener("click", function () {
      state.keyScale = "minor";
      if (state.keyMode) renderPads();
      refreshHeld();
    });

    document.getElementById("styles").addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (!b || !b.dataset.style) return;
      var changed = b.dataset.style !== state.style;
      state.style = b.dataset.style;
      var all = document.querySelectorAll("#styles button");
      for (var i = 0; i < all.length; i++) all[i].classList.toggle("on", all[i] === b);
      suggestSig = "";
      // A new Style pick loads that style's factory sound row; tweaks made
      // afterwards stick until the next Style pick or Factory reset.
      if (changed && applyStylePreset(state.style)) {
        refreshHeld();
      } else {
        enforceYogaDeepPaletteGate();
        paintSuggestions(computeSpec());
      }
    });

    document.getElementById("layouts").addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (!b || !b.dataset.layout) return;
      state.layout = b.dataset.layout;
      var all = document.querySelectorAll("#layouts button[data-layout]");
      for (var i = 0; i < all.length; i++) all[i].classList.toggle("on", all[i] === b);
      if (!sustainEnabled()) setSustain(false);
      paintSustainBtn();
      renderPads();
    });

    wireSustain();

    document.getElementById("voicing").addEventListener("input", function (e) {
      state.voicing = VOICINGS[Number(e.target.value)];
      refreshHeld();
    });

    document.getElementById("cutoff").addEventListener("input", function (e) {
      ChordAudio.setCutoff(Number(e.target.value));
    });
    document.getElementById("reverb").addEventListener("input", function (e) {
      ChordAudio.setReverb(Number(e.target.value));
    });
    document.getElementById("delay").addEventListener("input", function (e) {
      ChordAudio.setDelay(Number(e.target.value));
    });
    document.getElementById("warmth").addEventListener("input", function (e) {
      setWarmth(e.target.value);
    });
    document.getElementById("bpm").addEventListener("input", function (e) {
      setBpm(e.target.value);
    });

    document.getElementById("rec").addEventListener("click", onRecord);
    document.getElementById("play").addEventListener("click", onPlay);
    document.getElementById("clear").addEventListener("click", onClear);

    eatMove(padsEl);

    document.addEventListener("pointerdown", function () { unlock(); }, true);
    window.addEventListener("pointerup", function (e) { onPadUp(e); });
    window.addEventListener("pointercancel", function (e) { onPadUp(e); });

    document.addEventListener("touchend", onTouchGone, true);
    document.addEventListener("touchcancel", onTouchGone, true);
    document.addEventListener("contextmenu", function (e) {
      if (e.target.closest && e.target.closest("#pads")) e.preventDefault();
    });

    document.addEventListener("visibilitychange", function () {
      if (document.hidden) {
        killLoopVoices();
        releaseFingers(true);
        setSustain(false);
      } else if (loop.transport && ChordAudio.ctx) {
        var s = 60 / loop.bpm / 4;
        var elapsed = (ChordAudio.currentTime() - loop.startTime) / s;
        loop.nextIndex = Math.max(0, Math.ceil(elapsed));
      }
    });
  }

  // ---- Warmth + factory style presets ----
  var WARMTH_DEFAULT = 25;

  function clampWarmth(v) {
    v = Math.round(Number(v));
    if (!isFinite(v)) v = WARMTH_DEFAULT;
    return Math.min(100, Math.max(0, v));
  }

  // 0..100 on the UI; audio takes 0..1.
  function setWarmth(v) {
    v = clampWarmth(v);
    state.warmth = v;
    var el = document.getElementById("warmth");
    if (el.value !== String(v)) el.value = String(v);
    el.setAttribute("aria-valuetext", String(v));
    ChordAudio.setWarmth(v / 100);
  }

  // Applied on Style change. Never touches Key, layout or the Next grid.
  var STYLE_PRESETS = {
    pop:       { sound: "warm", bass: true,  voicing: "close", cutoff: 0.72, reverb: 0.14, delay: 0.10, bpm: 112, warmth: 15 },
    jazz:      { sound: "warm", bass: true,  voicing: "drop",  cutoff: 0.48, reverb: 0.28, delay: 0.18, bpm: 120, warmth: 70 },
    rnb:       { sound: "warm", bass: true,  voicing: "close", cutoff: 0.55, reverb: 0.34, delay: 0.22, bpm: 78,  warmth: 45 },
    romantic:  { sound: "warm", bass: true,  voicing: "low",   cutoff: 0.50, reverb: 0.44, delay: 0.12, bpm: 66,  warmth: 40 },
    ballad:    { sound: "bell", bass: true,  voicing: "close", cutoff: 0.44, reverb: 0.40, delay: 0.16, bpm: 68,  warmth: 30 },
    reggae:    { sound: "warm", bass: true,  voicing: "low",   cutoff: 0.58, reverb: 0.24, delay: 0.20, bpm: 76,  warmth: 40 },
    funk:      { sound: "reed", bass: true,  voicing: "bright", cutoff: 0.78, reverb: 0.10, delay: 0.08, bpm: 108, warmth: 22 },
    yoga:      { sound: "bell", bass: false, voicing: "close", cutoff: 0.40, reverb: 0.50, delay: 0.02, bpm: 60,  warmth: 20 },
    yogaDeep:  { sound: "warm", bass: false, voicing: "low",   cutoff: 0.32, reverb: 0.58, delay: 0.02, bpm: 52,  warmth: 30 }
  };

  // Yoga Deep: Dim/Sus4 type pads are unavailable (stillness palette).
  function enforceYogaDeepPaletteGate() {
    var gated = state.style === "yogaDeep";
    var types = document.querySelectorAll("#types button[data-type]");
    for (var i = 0; i < types.length; i++) {
      var t = types[i].dataset.type;
      if (t === "dim" || t === "sus4") {
        types[i].disabled = gated;
        types[i].classList.toggle("gated", gated);
        if (gated) {
          types[i].classList.remove("on");
          types[i].setAttribute("aria-pressed", "false");
        }
      } else {
        types[i].disabled = false;
        types[i].classList.remove("gated");
      }
    }
    if (!gated) return;
    var dirty = false;
    for (var id in paletteHolds) {
      if (paletteHolds[id].kind === "type" && (paletteHolds[id].value === "dim" || paletteHolds[id].value === "sus4")) {
        delete paletteHolds[id];
        dirty = true;
      }
    }
    if (state.type === "dim" || state.type === "sus4") {
      state.type = "major";
      dirty = true;
    }
    if (dirty) {
      var nextType = "major";
      for (var id2 in paletteHolds) {
        if (paletteHolds[id2].kind === "type") nextType = paletteHolds[id2].value;
      }
      state.type = nextType;
    }
  }

  // Push one preset row into state, controls and audio together.
  function applyStylePreset(style) {
    var p = STYLE_PRESETS[style];
    if (!p) return false;
    state.sound = p.sound;
    state.bass = p.bass;
    state.voicing = p.voicing;
    document.getElementById("voicing").value = String(Math.max(0, VOICINGS.indexOf(p.voicing)));
    document.getElementById("cutoff").value = String(p.cutoff);
    document.getElementById("reverb").value = String(p.reverb);
    document.getElementById("delay").value = String(p.delay);
    ChordAudio.setSound(p.sound);
    ChordAudio.setCutoff(p.cutoff);
    ChordAudio.setReverb(p.reverb);
    ChordAudio.setDelay(p.delay);
    setBpm(p.bpm);
    setWarmth(p.warmth);
    enforceYogaDeepPaletteGate();
    return true;
  }

  // ---- Settings persistence (localStorage, versioned) ----
  // Only sticky settings are stored. Chord type / extension buttons are
  // momentary (held), so they are intentionally not persisted.
  var STORE_KEY = "touchChord.settings.v1";
  var STORE_VERSION = 1;
  var LAYOUTS = ["octave", "piano", "fourths"];
  var SOUNDS = ["warm", "bell", "reed"];
  var STYLES = ["pop", "jazz", "rnb", "romantic", "ballad", "reggae", "funk", "yoga", "yogaDeep"];
  var SCALES = ["major", "minor"];

  function factoryDefaults() {
    return {
      layout: "octave",
      sound: "warm",
      bass: false,
      style: "pop",
      keyMode: false,
      keyRoot: 0,
      keyScale: "major",
      rootPc: 0,
      degree: 1,
      voicing: "close",
      cutoff: 0.62,
      reverb: 0.22,
      delay: 0.14,
      bpm: 96,
      warmth: WARMTH_DEFAULT
    };
  }

  function sanitizeSettings(raw) {
    var d = factoryDefaults();
    if (!raw || typeof raw !== "object") return d;
    function pick(v, list, def) { return list.indexOf(v) >= 0 ? v : def; }
    function bool(v, def) { return typeof v === "boolean" ? v : def; }
    function num(v, lo, hi, def, int) {
      if (typeof v !== "number" || !isFinite(v)) return def;
      if (int) v = Math.round(v);
      return Math.min(hi, Math.max(lo, v));
    }
    return {
      layout: pick(raw.layout, LAYOUTS, d.layout),
      sound: pick(raw.sound, SOUNDS, d.sound),
      bass: bool(raw.bass, d.bass),
      style: pick(raw.style, STYLES, d.style),
      keyMode: bool(raw.keyMode, d.keyMode),
      keyRoot: num(raw.keyRoot, 0, 11, d.keyRoot, true),
      keyScale: pick(raw.keyScale, SCALES, d.keyScale),
      rootPc: num(raw.rootPc, 0, 11, d.rootPc, true),
      degree: num(raw.degree, 1, 7, d.degree, true),
      voicing: pick(raw.voicing, VOICINGS, d.voicing),
      cutoff: num(raw.cutoff, 0, 1, d.cutoff),
      reverb: num(raw.reverb, 0, 1, d.reverb),
      delay: num(raw.delay, 0, 1, d.delay),
      bpm: num(raw.bpm, 50, 180, d.bpm, true),
      warmth: num(raw.warmth, 0, 100, d.warmth, true)
      // Legacy `latch` key (cce4d86) is ignored; Sustain is never persisted.
    };
  }

  function storageGet() {
    try { return window.localStorage ? window.localStorage.getItem(STORE_KEY) : null; } catch (err) { return null; }
  }
  function storageSet(str) {
    try { if (window.localStorage) window.localStorage.setItem(STORE_KEY, str); return true; } catch (err) { return false; }
  }
  function storageClear() {
    try { if (window.localStorage) window.localStorage.removeItem(STORE_KEY); } catch (err) {}
  }

  // Future builds: read older keys/versions here and migrate into v1+ shape.
  function loadSettings() {
    var str = storageGet();
    if (!str) return factoryDefaults();
    try {
      var env = JSON.parse(str);
      if (!env || typeof env !== "object" || env.v !== STORE_VERSION) return factoryDefaults();
      return sanitizeSettings(env.settings);
    } catch (err) {
      return factoryDefaults();
    }
  }

  function collectSettings() {
    return {
      layout: state.layout,
      sound: state.sound,
      bass: !!state.bass,
      style: state.style,
      keyMode: !!state.keyMode,
      keyRoot: state.keyRoot,
      keyScale: state.keyScale,
      rootPc: state.rootPc,
      degree: state.degree,
      voicing: state.voicing,
      cutoff: Number(document.getElementById("cutoff").value),
      reverb: Number(document.getElementById("reverb").value),
      delay: Number(document.getElementById("delay").value),
      bpm: state.bpm,
      warmth: clampWarmth(document.getElementById("warmth").value)
    };
  }

  var saveTimer = 0;
  var lastSaved = "";
  var persistReady = false;

  function saveNow() {
    if (saveTimer) {
      clearTimeout(saveTimer);
      saveTimer = 0;
    }
    if (!persistReady) return;
    var str = JSON.stringify(collectSettings());
    if (str === lastSaved) return;
    if (storageSet("{\"v\":" + STORE_VERSION + ",\"settings\":" + str + "}")) lastSaved = str;
  }

  function scheduleSave(ms) {
    if (!persistReady) return;
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, ms == null ? 150 : ms);
  }

  function markOn(groupSel, attr, value) {
    var all = document.querySelectorAll(groupSel + " button");
    for (var i = 0; i < all.length; i++) {
      if (all[i].dataset[attr] == null) continue;
      var on = all[i].dataset[attr] === value;
      all[i].classList.toggle("on", on);
      if (all[i].hasAttribute("aria-pressed") || all[i].getAttribute("role") === "radio") {
        all[i].setAttribute("aria-pressed", on ? "true" : "false");
      }
    }
  }

  // Push a settings object into state, controls and audio. Caller re-renders.
  function applySettings(s) {
    state.layout = s.layout;
    state.sound = s.sound;
    state.bass = s.bass;
    state.style = s.style;
    state.keyMode = s.keyMode;
    state.keyRoot = s.keyRoot;
    state.keyScale = s.keyScale;
    state.rootPc = s.rootPc;
    state.degree = s.degree;
    state.voicing = s.voicing;
    state.forceChord = null;
    state.rootMidi = null;
    sustainDown = false;
    sustainPointers = {};
    dumpSustain();

    markOn("#layouts", "layout", s.layout);
    paintSustainBtn();
    markOn("#styles", "style", s.style);
    document.getElementById("keyRoot").value = String(s.keyRoot);
    document.getElementById("voicing").value = String(Math.max(0, VOICINGS.indexOf(s.voicing)));
    document.getElementById("cutoff").value = String(s.cutoff);
    document.getElementById("reverb").value = String(s.reverb);
    document.getElementById("delay").value = String(s.delay);

    ChordAudio.setSound(s.sound);
    ChordAudio.setCutoff(s.cutoff);
    ChordAudio.setReverb(s.reverb);
    ChordAudio.setDelay(s.delay);
    setBpm(s.bpm);
    setWarmth(s.warmth);
    suggestSig = "";
    enforceYogaDeepPaletteGate();
  }

  var toastTimer = 0;
  function showToast(msg) {
    var el = document.getElementById("toast");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 1600);
  }

  function factoryReset() {
    if (saveTimer) {
      clearTimeout(saveTimer);
      saveTimer = 0;
    }
    storageClear();
    clearSuggestPreview();
    var d = factoryDefaults();
    applySettings(d);
    renderPads();
    refreshHeld();
    updateSymbol();
    if (saveTimer) {
      clearTimeout(saveTimer);
      saveTimer = 0;
    }
    // Storage stays empty until the user changes something again.
    lastSaved = JSON.stringify(collectSettings());
    showToast("Settings reset to factory defaults");
    var btn = document.getElementById("configBtn");
    btn.classList.add("flash");
    setTimeout(function () { btn.classList.remove("flash"); }, 450);
  }

  function wireConfig() {
    var btn = document.getElementById("configBtn");
    var menu = document.getElementById("configMenu");
    var wrap = document.getElementById("configWrap");
    function setOpen(open) {
      menu.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      setOpen(menu.hidden);
      if (!menu.hidden) document.getElementById("factoryReset").focus({ preventScroll: true });
    });
    document.getElementById("factoryReset").addEventListener("click", function () {
      setOpen(false);
      factoryReset();
    });
    document.addEventListener("pointerdown", function (e) {
      if (!menu.hidden && !wrap.contains(e.target)) setOpen(false);
    }, true);
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !menu.hidden) {
        setOpen(false);
        btn.focus({ preventScroll: true });
      }
    });

    // Every sticky control saves on change (sliders debounced).
    ["engines", "bass", "keyMode", "keyMajor", "keyMinor", "styles", "layouts"].forEach(function (id) {
      document.getElementById(id).addEventListener("click", function () { scheduleSave(0); });
    });
    document.getElementById("keyRoot").addEventListener("change", function () { scheduleSave(0); });
    ["voicing", "cutoff", "reverb", "delay", "warmth", "bpm"].forEach(function (id) {
      var el = document.getElementById(id);
      el.addEventListener("input", function () { scheduleSave(150); });
      el.addEventListener("change", function () { scheduleSave(0); });
    });
    window.addEventListener("pagehide", saveNow);
    document.addEventListener("visibilitychange", function () { if (document.hidden) saveNow(); });
  }

  var startBanner = document.getElementById("unlock");
  if (startBanner) startBanner.textContent = "Tap anywhere to enable sound";

  try {
    wire();
    wireConfig();
    var initial;
    try { initial = loadSettings(); } catch (err) { initial = factoryDefaults(); }
    try { applySettings(initial); } catch (err2) { applySettings(factoryDefaults()); }
    renderPads();
    updateSymbol();
    lastSaved = JSON.stringify(collectSettings());
    persistReady = true;
  } finally {
    document.documentElement.classList.remove("tc-boot");
  }
})();

</script>


</body>
