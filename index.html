<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14120f">
<title>Touch Chord</title>
<style>
:root {
  color-scheme: dark;
  --bg: #14120f;
  --bg-2: #1c1914;
  --ink: #f4efe6;
  --muted: #b7ab9a;
  --line: #3a332b;
  --pad: #262219;
  --copper: #e2a15a;
  --copper-ink: #2a1c0c;
  --sea: #8fcbb8;
  --lilac: #d2a9cc;
  --moss: #b7c98a;
  --danger: #e07a62;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  min-height: 100%;
  min-height: -webkit-fill-available;
  background: var(--bg);
  color: var(--ink);
  font-family: "Avenir Next", "Segoe UI", sans-serif;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  background:
    radial-gradient(900px 380px at 8% -10%, rgba(143, 203, 184, 0.16), transparent 55%),
    radial-gradient(700px 420px at 110% 110%, rgba(226, 161, 90, 0.12), transparent 50%),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.015) 0 1px, transparent 1px 14px),
    var(--bg);
}

button, input, select { font: inherit; color: inherit; }

button {
  min-height: 40px;
  border: 1px solid var(--line);
  background: var(--bg-2);
  color: var(--ink);
  border-radius: 10px;
  padding: 0 12px;
  cursor: pointer;
  touch-action: manipulation;
}

button.on, button[aria-pressed="true"].toggle.on {
  background: var(--copper);
  color: var(--copper-ink);
  border-color: transparent;
}

#app {
  height: 100vh;
  height: 100dvh;
  min-height: 0;
  max-height: 100dvh;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  gap: 12px;
  padding: calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  overflow: visible;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

header {
  display: flex;
  align-items: center;
  gap: 12px 16px;
  min-height: 0;
}

.brand {
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-size: 12px;
  color: var(--sea);
}

.symbolwrap {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 7rem;
  gap: 2px;
}

#symbol {
  font-family: Palatino, "Iowan Old Style", Georgia, serif;
  font-size: clamp(28px, 4vw, 42px);
  line-height: 0.9;
  letter-spacing: -0.03em;
}

#symbol.sounding { color: var(--copper); }

#tones {
  color: var(--muted);
  font-size: 13px;
  letter-spacing: 0.06em;
}


.seg {
  display: flex;
  flex-wrap: nowrap;
  gap: 4px;
}

.seg button { min-width: 44px; }

#bass.on { background: var(--sea); color: #10211c; border-color: transparent; }


#chords {
  flex: 0 0 228px;
  align-self: stretch;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-top: 4px;
  touch-action: none;
}

#chords button { touch-action: none; }

#chords .dock-label {
  color: var(--muted);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

#palette {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: repeat(4, minmax(0, 1fr));
  grid-auto-flow: column;
  gap: 6px;
  flex: 1 1 auto;
  min-height: 0;
}

#types, #exts { display: contents; }

#types button, #exts button {
  width: 100%;
  min-width: 0;
  min-height: 40px;
  text-align: center;
  padding: 0 4px;
  font-size: 13px;
}

.stage {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow: hidden;
}

.controls {
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  gap: 8px 12px;
  min-width: 0;
}
.soundbox {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-left: auto;
  flex: 0 0 auto;
}
.keybox { flex: 0 0 auto; }

.keybox {
  display: flex;
  align-items: center;
  gap: 6px;
}

#keyReadout {
  color: var(--muted);
  font-size: 13px;
}

select {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  min-height: 40px;
  padding: 0 8px;
  touch-action: manipulation;
}

body.is-key #types button {
  opacity: 0.4;
  pointer-events: none;
}

#exts button.dormant { opacity: 0.45; }

.pads {
  display: grid;
  gap: 8px;
  flex: 0 0 auto;
  min-height: 104px;
  touch-action: none;
}

.pads.chromatic { grid-template-columns: repeat(12, minmax(0, 1fr)); }
.pads.diatonic { grid-template-columns: repeat(7, minmax(0, 1fr)); }

.pad {
  -webkit-appearance: none;
  appearance: none;
  height: 104px;
  min-height: 104px;
  border-radius: 14px;
  background: var(--pad);
  border: 1px solid #423a30;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  gap: 4px;
  padding: 10px 4px 12px;
  font-size: clamp(15px, 1.5vw, 20px);
  line-height: 1;
}

.pad .roman {
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--muted);
}

.pad.major { box-shadow: inset 0 -4px 0 var(--copper); }
.pad.minor { box-shadow: inset 0 -4px 0 var(--sea); }
.pad.dim { box-shadow: inset 0 -4px 0 var(--lilac); }
.pad.sus4 { box-shadow: inset 0 -4px 0 var(--moss); }

.pad.selected { outline: 2px solid var(--copper); outline-offset: -2px; }

.pad.held {
  background: var(--copper);
  color: var(--copper-ink);
  border-color: transparent;
  box-shadow: none;
}

.pad.held .roman { color: rgba(42, 28, 12, 0.7); }

.voicing { min-width: 0; }

.vhead {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 0;
}

.vhead b { color: var(--ink); font-weight: 650; }

.vticks {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  letter-spacing: 0.06em;
  color: var(--muted);
  text-transform: uppercase;
}

.vticks span.on { color: var(--copper); }

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 28px;
  background: transparent;
  margin: 0;
  touch-action: manipulation;
}

input[type="range"]::-webkit-slider-runnable-track {
  height: 6px;
  background: #3c342c;
  border-radius: 99px;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 22px;
  height: 22px;
  margin-top: -8px;
  border-radius: 50%;
  background: #f3ddc2;
  border: 0;
}

input[type="range"]::-moz-range-track {
  height: 6px;
  background: #3c342c;
  border-radius: 99px;
  border: 0;
}

input[type="range"]::-moz-range-thumb {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #f3ddc2;
  border: 0;
}


.suggest {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 0 0 auto;
  min-width: 0;
  overflow-x: auto;
}
.suggest .lbl {
  color: var(--muted);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  flex: 0 0 auto;
}
.suggest button {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  min-height: 40px;
  padding: 4px 10px;
  line-height: 1.15;
  white-space: nowrap;
}
.suggest button b { font-size: 14px; font-weight: 700; }
.suggest button span { font-size: 11px; color: var(--muted); }
.suggest button.happy { border-color: #6d8f4e; }
.suggest button.sad { border-color: #7d6ea8; }
.phase {
  height: 3px;
  width: 0;
  flex: 0 0 auto;
  background: var(--sea);
  border-radius: 99px;
  pointer-events: none;
}

footer {
  display: flex;
  align-items: center;
  gap: 10px 16px;
  min-height: 0;
}

footer label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--muted);
  min-width: 0;
}

footer label input[type="range"] { width: 110px; }

.bpm b { color: var(--ink); min-width: 2.2ch; display: inline-block; }

.transport {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
}

#rec.on {
  background: var(--danger);
  color: #2a100c;
  border-color: transparent;
}

#play.on {
  background: var(--sea);
  color: #10211c;
  border-color: transparent;
}

#loopStatus {
  font-size: 12px;
  color: var(--muted);
  min-width: 4.5em;
}

#unlock {
  align-self: center;
  background: var(--copper);
  color: var(--copper-ink);
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 14px;
  font-weight: 650;
  pointer-events: none;
}

#unlock[hidden] { display: none; }


.kb-wrap {
  margin-top: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1 1 auto;
  min-height: 0;
}

.layouts { align-items: center; }

.layouts .lbl {
  color: var(--muted);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-right: 4px;
}

.kb { touch-action: none; }

.kb.piano {
  position: relative;
  flex: 1 1 auto;
  height: auto;
  min-height: 180px;
  display: flex;
  flex-direction: column;
}

.kb.piano .whites {
  display: flex;
  flex: 1 1 auto;
  height: auto;
  min-height: 0;
  gap: 3px;
}

.kb.piano .blacks {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.kb .pad {
  height: auto;
  min-height: 0;
  border-radius: 0 0 8px 8px;
  padding: 4px 2px 8px;
  font-size: 12px;
}

.kb.piano .white {
  flex: 1 1 0;
  height: 100%;
  background: #f4efe4;
  color: #2a1c0c;
  border: 1px solid #c9bfb0;
}

.kb.piano .black {
  pointer-events: auto;
  position: absolute;
  top: 0;
  height: 62%;
  width: var(--black-w, 18px);
  background: #1b1714;
  color: #f4efe4;
  border: 1px solid #000;
  z-index: 2;
  font-size: 10px;
  padding-bottom: 4px;
}

.kb.piano { --black-w: calc(100% / var(--whites) * 0.58); }

.kb .pad.out { opacity: 0.32; }

.kb.piano .white.held,
.kb.piano .black.held,
.kb.fourths .pad.held {
  background: var(--copper);
  color: var(--copper-ink);
}

.kb.fourths {
  display: grid;
  flex: 1 1 auto;
  min-height: 0;
  height: auto;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-template-rows: repeat(4, minmax(44px, 1fr));
  gap: 6px;
}

.kb.fourths .pad {
  min-height: 0;
  height: auto;
  border-radius: 10px;
  font-size: 15px;
}

@media (max-width: 1100px) {
  footer { flex-wrap: wrap; }
  .transport { margin-left: 0; }
  footer label input[type="range"] { width: 88px; }
}

@media (max-height: 640px) {
  #app { gap: 6px; padding: 8px 10px; }
  .kb.piano { min-height: 96px; }
  .kb.fourths { grid-template-rows: repeat(4, minmax(28px, 1fr)); }
  button, select { min-height: 32px; padding: 0 8px; font-size: 13px; }
  #symbol { font-size: 26px; }
  #tones { display: none; }
  .controls { flex-wrap: nowrap; overflow-x: auto; }
}

@media (max-width: 1080px) {
  #chords { flex-basis: 188px; }
  #palette { gap: 4px; }
  #types button, #exts button { min-height: 36px; font-size: 12px; }
  #app { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  .kb.piano { min-height: 160px; }
  header { flex-wrap: nowrap; }
  .controls { flex-wrap: nowrap; overflow-x: auto; }
  footer label { flex: 1 1 42%; }
  footer label input[type="range"] { flex: 1; width: auto; }
}

@media (orientation: landscape) and (max-height: 520px) {
  html, body {
    height: 100%;
    overflow: hidden;
  }
  #app {
    height: 100svh;
    min-height: 0;
    max-height: 100svh;
    overflow: hidden;
    gap: 6px;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom)) 8px;
  }
  .stage {
    min-height: 0;
    height: 100%;
    gap: 4px;
    overflow: hidden;
  }
  #symbol { font-size: 22px; }
  .suggest button { min-height: 30px; padding: 2px 8px; }
  .suggest button b { font-size: 12px; }
  .suggest .lbl { display: none; }
  #tones, .vticks { display: none; }
  header { gap: 6px 8px; }
  button, select { min-height: 30px; padding: 0 8px; font-size: 12px; }
  .kb-wrap {
    flex: 1 1 0;
    min-height: 84px;
    margin-top: 0;
    gap: 4px;
  }
  .kb.piano, .kb.fourths {
    position: relative;
    flex: 1 1 0;
    height: auto;
    min-height: 64px;
  }
  .kb.fourths { grid-template-rows: repeat(4, minmax(0, 1fr)); }
  footer { gap: 4px 8px; flex-wrap: nowrap; }
  footer label { font-size: 11px; }
  footer label input[type="range"] { width: 56px; }
  #chords { flex-basis: 156px; gap: 4px; }
  #palette { gap: 3px; }
  #types button, #exts button { min-height: 0; font-size: 11px; padding: 0 2px; }
}

</style>
</head>
<body>
<div id="app">
  <aside id="chords" aria-label="Chord types">
    <div class="dock-label">Chords</div>
    <div id="palette">
    <div id="types" role="group" aria-label="Chord type">
      <button type="button" data-type="major" aria-pressed="false">Major</button>
      <button type="button" data-type="minor" aria-pressed="false">Minor</button>
      <button type="button" data-type="sus4" aria-pressed="false">Sus4</button>
      <button type="button" data-type="dim" aria-pressed="false" aria-label="Diminished">Dim</button>
    </div>
    <div id="exts" role="group" aria-label="Extensions">
      <button type="button" data-ext="six" aria-pressed="false">6</button>
      <button type="button" data-ext="min7" aria-pressed="false">min7</button>
      <button type="button" data-ext="maj7" aria-pressed="false">maj7</button>
      <button type="button" data-ext="nine" aria-pressed="false">9</button>
    </div>
    </div>
  </aside>
  <div class="stage">
  <div id="unlock">Open this file in Safari. Chrome on iPad will not run it.</div>
  <header>
    <div class="brand">Touch Chord</div>
    <div class="symbolwrap">
      <div id="symbol" aria-live="polite">C</div>
      <div id="tones">C E G</div>
    </div>
  </header>

  <div id="suggest" class="suggest" aria-label="Suggested next chords"></div>

  <section class="controls">
    <div class="keybox">
      <button id="keyMode" type="button" class="toggle" aria-pressed="false">Key</button>
      <select id="keyRoot" aria-label="Key root"></select>
      <div class="seg" role="radiogroup" aria-label="Key scale">
        <button id="keyMajor" type="button" class="on">Major</button>
        <button id="keyMinor" type="button">Minor</button>
      </div>
      <span id="keyReadout">Chromatic</span>
    </div>
    <div class="soundbox">
      <div id="engines" class="seg" role="radiogroup" aria-label="Sound">
        <button type="button" data-sound="warm" class="on" title="Detuned saw pad">Warm</button>
        <button type="button" data-sound="bell" title="FM bell">Bell</button>
        <button type="button" data-sound="reed" title="Filtered pulse">Reed</button>
      </div>
      <button id="bass" type="button" class="toggle" aria-pressed="false">Bass</button>
    </div>
  </section>

  <div class="voicing">
    <div class="vhead">Voicing <b id="vname">close</b></div>
    <input id="voicing" type="range" min="0" max="4" step="1" value="2" aria-label="Voicing" aria-valuetext="close">
    <div class="vticks" aria-hidden="true">
      <span>drop</span><span>low</span><span>close</span><span>high</span><span>bright</span>
    </div>
  </div>

  <footer>
    <label>Cutoff <input id="cutoff" type="range" min="0" max="1" step="0.01" value="0.62" aria-label="Filter cutoff"></label>
    <label>Reverb <input id="reverb" type="range" min="0" max="1" step="0.01" value="0.22" aria-label="Reverb mix"></label>
    <label>Delay <input id="delay" type="range" min="0" max="1" step="0.01" value="0.14" aria-label="Delay mix"></label>
    <label class="bpm">BPM <b id="bpmVal">96</b>
      <input id="bpm" type="range" min="60" max="180" step="1" value="96" aria-label="Tempo">
    </label>
    <div class="transport">
      <button id="rec" type="button">Record</button>
      <button id="play" type="button">Play</button>
      <button id="clear" type="button">Clear</button>
      <span id="loopStatus">Empty</span>
    </div>
  </footer>

  <div class="kb-wrap">
    <div id="phase" class="phase"></div>
    <div id="layouts" class="layouts seg" role="radiogroup" aria-label="Keyboard layout">
      <span class="lbl">Layout</span>
      <button type="button" data-layout="piano" class="on">Piano</button>
      <button type="button" data-layout="octave">Octave</button>
      <button type="button" data-layout="fourths">Fourths</button>
    </div>
    <div id="pads" class="kb piano" aria-label="Chord keyboard"></div>
  </div>

</div>
</div>
<script>
"use strict";

(function () {
  var LETTERS = ["C", "D", "E", "F", "G", "A", "B"];
  var NATURAL = [0, 2, 4, 5, 7, 9, 11];

  // Preferred chromatic spellings: C C# D Eb E F F# G Ab A Bb B
  var ROOT_SPELL = [
    { li: 0, acc: 0 },
    { li: 0, acc: 1 },
    { li: 1, acc: 0 },
    { li: 2, acc: -1 },
    { li: 2, acc: 0 },
    { li: 3, acc: 0 },
    { li: 3, acc: 1 },
    { li: 4, acc: 0 },
    { li: 5, acc: -1 },
    { li: 5, acc: 0 },
    { li: 6, acc: -1 },
    { li: 6, acc: 0 }
  ];

  var DEGREE_STEPS = {
    0: 0,
    2: 1,
    3: 2,
    4: 2,
    5: 3,
    6: 4,
    7: 4,
    8: 5,
    9: 5,
    10: 6,
    11: 6,
    14: 1
  };

  var VOICINGS = ["drop", "low", "close", "high", "bright"];

  var MAJOR_ROMAN = ["I", "ii", "iii", "IV", "V", "vi", "vii"];
  var MINOR_ROMAN = ["i", "ii", "III", "iv", "v", "VI", "VII"];
  var MAJOR_QUALITY = ["major", "minor", "minor", "major", "major", "minor", "dim"];
  var MINOR_QUALITY = ["minor", "dim", "major", "minor", "minor", "major", "major"];
  var MAJOR_SCALE = [0, 2, 4, 5, 7, 9, 11];
  var MINOR_SCALE = [0, 2, 3, 5, 7, 8, 10];

  function mod12(n) {
    return ((n % 12) + 12) % 12;
  }

  function accStr(acc) {
    if (acc === 0) return "";
    if (acc === 1) return "#";
    if (acc === -1) return "b";
    if (acc === 2) return "x";
    if (acc === -2) return "bb";
    if (acc > 2) return new Array(acc + 1).join("#");
    return new Array(-acc + 1).join("b");
  }

  function spellRoot(pc) {
    var s = ROOT_SPELL[mod12(pc)];
    return { li: s.li, acc: s.acc };
  }

  function rootPitchClass(root) {
    return mod12(NATURAL[root.li] + root.acc);
  }

  function noteName(root) {
    return LETTERS[root.li] + accStr(root.acc);
  }

  function spellInterval(root, semitones) {
    var steps = DEGREE_STEPS[semitones];
    if (steps == null) throw new Error("unsupported interval " + semitones);
    var li = (root.li + steps) % 7;
    var naturalPc = NATURAL[li];
    var target = mod12(rootPitchClass(root) + semitones);
    var acc = target - naturalPc;
    if (acc > 6) acc -= 12;
    if (acc < -6) acc += 12;
    return { li: li, acc: acc, pc: target, name: LETTERS[li] + accStr(acc) };
  }

  function normalizeExt(ext) {
    ext = ext || {};
    return {
      six: !!ext.six,
      min7: !!ext.min7,
      maj7: !!ext.maj7,
      nine: !!(ext.nine || ext["9"])
    };
  }

  function chordIntervals(type, ext) {
    var base = {
      major: [0, 4, 7],
      minor: [0, 3, 7],
      sus4: [0, 5, 7],
      dim: [0, 3, 6]
    }[type];
    if (!base) throw new Error("unknown chord type " + type);
    var e = normalizeExt(ext);
    var iv = base.slice();
    var hasMaj7 = e.maj7;
    var hasMin7 = e.min7 && !hasMaj7;
    var has7 = hasMaj7 || hasMin7;
    if (e.six && !has7) iv.push(9);

  var NEXT_MAJOR = {
    1: [5, 4, 6, 2],
    2: [5, 4, 1],
    3: [6, 4, 1],
    4: [5, 1, 2],
    5: [1, 6, 4],
    6: [4, 2, 5],
    7: [1, 6]

  var NEXT_MINOR = {
    1: [6, 7, 3, 4],
    2: [5, 1, 6],
    3: [6, 7, 4],
    4: [1, 7, 5],
    5: [1, 6, 4],
    6: [3, 4, 7],

  function suggestionKey(spec) {

    if (spec.type === "dim") return { pc: wrap12(spec.rootPc + 1), mode: "major" };
    return { pc: spec.rootPc, mode: "major" };
  }

  function nextChords(spec) {
    var key = suggestionKey(spec);
    var degrees = Theory.scaleDegrees(key.pc, key.mode);
    var degree = 1;
    var matched = false;
    for (var i = 0; i < degrees.length; i++) {
      if (degrees[i].pc === spec.rootPc && degrees[i].type === spec.type) {
        degree = degrees[i].degree;
        matched = true;
        break;
      }
    }
    if (!matched) {
      for (var j = 0; j < degrees.length; j++) {
        if (degrees[j].pc === spec.rootPc && degrees[j].type !== "dim") {

    var hops = table[degree] || table[1];

    keyBtn.setAttribute("aria-pressed", state.keyMode ? "true" : "false");
    var types = document.querySelectorAll("#types button");
    for (var t = 0; t < types.length; t++) {
      var typeBtn = types[t];
      var onType = typeHeld(typeBtn.dataset.type) || (suggestPreview && suggestPreview.type === typeBtn.dataset.type);
      typeBtn.classList.toggle("on", onType);
      typeBtn.setAttribute("aria-pressed", onType ? "true" : "false");
    }
    var exts = document.querySelectorAll("#exts button");
    var has7 = !!(state.extensions.min7 || state.extensions.maj7);
    for (var x = 0; x < exts.length; x++) {
      var extBtn = exts[x];
      var extName = extBtn.dataset.ext;
      var onExt = !!state.extensions[extName];
      var dormant = (extName === "six" && has7) || (extName === "min7" && state.extensions.maj7);
      extBtn.classList.toggle("on", onExt);
      extBtn.classList.toggle("dormant", dormant && !onExt);
      extBtn.setAttribute("aria-pressed", onExt ? "true" : "false");
    }
    var engines = document.querySelectorAll("#engines button");
    for (var n = 0; n < engines.length; n++) {
      engines[n].classList.toggle("on", engines[n].dataset.sound === state.sound);
      engines[n].setAttribute("aria-pressed", engines[n].dataset.sound === state.sound ? "true" : "false");
    }
    var bass = document.getElementById("bass");
    bass.classList.toggle("on", state.bass);
    bass.setAttribute("aria-pressed", state.bass ? "true" : "false");
    document.getElementById("keyMajor").classList.toggle("on", state.keyScale === "major");
    document.getElementById("keyMinor").classList.toggle("on", state.keyScale === "minor");
    document.getElementById("keyReadout").textContent = state.keyMode
      ? "Key of " + Theory.NOTE_NAMES[state.keyRoot] + (state.keyScale === "minor" ? " minor" : " major")
      : "Chromatic";
    if (!strumLock) layoutStrum(spec.midis.length);
    paintSuggestions(spec);
    paintPads();
    paintLoop();
  }

  var paletteHolds = {};

  function typeHeld(name) {
    for (var id in paletteHolds) {
      if (paletteHolds[id].kind === "type" && paletteHolds[id].value === name) return true;
    }
    return false;
  }

  function extStillHeld(name) {
    for (var id in paletteHolds) {
      if (paletteHolds[id].kind === "ext" && paletteHolds[id].value === name) return true;
    }
    return false;
  }

  var paletteTimer = 0;

  function syncPalette() {
    var nextType = "major";
    for (var id in paletteHolds) {
      if (paletteHolds[id].kind === "type") nextType = paletteHolds[id].value;
    }
    state.type = nextType;
    var keys = ["six", "min7", "maj7", "nine"];
    for (var i = 0; i < keys.length; i++) state.extensions[keys[i]] = extStillHeld(keys[i]);
    if (paletteTimer) clearTimeout(paletteTimer);
    paletteTimer = setTimeout(function () {
      paletteTimer = 0;
      refreshHeld();
    }, 20);
  }

  function releasePalette(pointerId) {
    if (pointerId == null) {
      var any = false;
      for (var id in paletteHolds) any = true;
      if (!any) return;
      paletteHolds = {};
    } else {
      if (!paletteHolds[pointerId]) return;
      delete paletteHolds[pointerId];
    }
    syncPalette();
  }

  function onPaletteDown(e) {
    if (e.button != null && e.button !== 0) return;
    var b = e.target.closest ? e.target.closest("button") : null;
    if (!b || b.disabled || !b.closest("#palette")) return;
    if (b.dataset.type && state.keyMode) return;
    e.preventDefault();
    paletteHolds[e.pointerId] = {
      kind: b.dataset.type ? "type" : "ext",
      value: b.dataset.type || b.dataset.ext
    };
    try { b.setPointerCapture(e.pointerId); } catch (err) {}
    syncPalette();
  }

  function onPaletteUp(e) {
    releasePalette(e.pointerId);
  }


  function onTouchGone(e) {
    var changed = e.changedTouches;
    if (changed) {
      for (var i = 0; i < changed.length; i++) {
        var id = changed[i].identifier;
        releaseFinger(id);
        releasePalette(id);
        if (id === strumPointer) onStrumUp({ pointerId: id });
      }
    }
    if (!e.touches || e.touches.length === 0) {
      releaseFingers();
      releasePalette(null);
      if (strumPointer != null) onStrumUp({ pointerId: strumPointer });
    }
  }

  function wire() {
    var keySel = document.getElementById("keyRoot");
    Theory.NOTE_NAMES.forEach(function (name, i) {
      var opt = document.createElement("option");
      opt.value = String(i);
      opt.textContent = name;
      keySel.appendChild(opt);
    });

    var palette = document.getElementById("palette");
    palette.addEventListener("pointerdown", onPaletteDown);
    palette.addEventListener("pointerup", onPaletteUp);
    palette.addEventListener("pointercancel", onPaletteUp);
    window.addEventListener("pointerup", onPaletteUp);
    window.addEventListener("pointercancel", onPaletteUp);

    document.getElementById("engines").addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (!b) return;
      state.sound = b.dataset.sound;
      ChordAudio.setSound(state.sound);
      refreshHeld();
    });

    document.getElementById("bass").addEventListener("click", function () {
      state.bass = !state.bass;
      refreshHeld();
    });

    document.getElementById("keyMode").addEventListener("click", function () {
      state.keyMode = !state.keyMode;
      if (state.keyMode) {
        var degs = Theory.scaleDegrees(state.keyRoot, state.keyScale);
        var found = 1;
        for (var i = 0; i < degs.length; i++) {
          if (degs[i].pc === state.rootPc) found = degs[i].degree;
        }
        state.degree = found;
      } else {
        var d = Theory.degreeChord(state.keyRoot, state.keyScale, state.degree);
        state.rootPc = d.rootPc;
      }
      renderPads();
      refreshHeld();
    });

    keySel.addEventListener("change", function () {
      state.keyRoot = Number(keySel.value);
      renderPads();
      refreshHeld();
    });

    document.getElementById("keyMajor").addEventListener("click", function () {
      state.keyScale = "major";
      if (state.keyMode) renderPads();
      refreshHeld();
    });
    document.getElementById("keyMinor").addEventListener("click", function () {
      state.keyScale = "minor";
      if (state.keyMode) renderPads();
      refreshHeld();
    });

    document.getElementById("layouts").addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (!b || !b.dataset.layout) return;
      state.layout = b.dataset.layout;
      var all = document.querySelectorAll("#layouts button");
      for (var i = 0; i < all.length; i++) all[i].classList.toggle("on", all[i] === b);
      renderPads();
    });

    document.getElementById("voicing").addEventListener("input", function (e) {
      state.voicing = VOICINGS[Number(e.target.value)];
      refreshHeld();
    });

    document.getElementById("cutoff").addEventListener("input", function (e) {
      ChordAudio.setCutoff(Number(e.target.value));
    });
    document.getElementById("reverb").addEventListener("input", function (e) {
      ChordAudio.setReverb(Number(e.target.value));
    });
    document.getElementById("delay").addEventListener("input", function (e) {
      ChordAudio.setDelay(Number(e.target.value));
    });
    document.getElementById("bpm").addEventListener("input", function (e) {
      setBpm(e.target.value);
    });

    document.getElementById("rec").addEventListener("click", onRecord);
    document.getElementById("play").addEventListener("click", onPlay);
    document.getElementById("clear").addEventListener("click", onClear);

    if (strumEl) {
      strumEl.addEventListener("pointerdown", onStrumDown);
      strumEl.addEventListener("pointermove", onStrumMove);
      strumEl.addEventListener("pointerup", onStrumUp);
      strumEl.addEventListener("pointercancel", onStrumUp);
      eatMove(strumEl);
    }

    eatMove(padsEl);

    document.addEventListener("pointerdown", function () { unlock(); }, true);
    window.addEventListener("pointerup", function (e) { onPadUp(e); onStrumUp(e); });
    window.addEventListener("pointercancel", function (e) { onPadUp(e); onStrumUp(e); });

    document.addEventListener("touchend", onTouchGone, true);
    document.addEventListener("touchcancel", onTouchGone, true);
    document.addEventListener("contextmenu", function (e) {
      if (e.target.closest && e.target.closest("#pads, #strum")) e.preventDefault();
    });

    document.addEventListener("visibilitychange", function () {
      if (document.hidden) {
        killLoopVoices();
        releaseFingers();
      } else if (loop.transport && ChordAudio.ctx) {
        var s = 60 / loop.bpm / 4;
        var elapsed = (ChordAudio.currentTime() - loop.startTime) / s;
        loop.nextIndex = Math.max(0, Math.ceil(elapsed));
      }
    });
  }

  var startBanner = document.getElementById("unlock");
  if (startBanner) startBanner.textContent = "Tap anywhere to enable sound";

  wire();
  renderPads();
  updateSymbol();
  ChordAudio.setBpm(96);
  ChordAudio.setCutoff(0.62);
  ChordAudio.setReverb(0.22);
  ChordAudio.setDelay(0.14);
})();

</script>


</body>
</html>
